services:
  youtubedlbot:
    image: youtubedlbot
    build:
      context: .
      dockerfile: ./Dockerfile
    command:
      [
        "sh",
        "-c",
        "pip install --no-cache-dir debugpy -t /tmp && python /tmp/debugpy --wait-for-client --listen 0.0.0.0:5678 main.py"
      ]
    ports:
      - "5678:5678"
